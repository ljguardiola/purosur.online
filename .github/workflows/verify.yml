name: Verify

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request supersedes the run still going for its previous push. Runs on main
# get a group of their own per commit, so they are never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-24.04' || fromJSON(vars.LINUX_RUNNER || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # Only a pull request may skip: the job still runs because it is a required check. A push to
      # main always verifies its whole tree, because its success is what lets the deploy ship it,
      # and the commit before it may not have passed.
      - name: Decide the change's scope
        id: scope
        if: github.event_name == 'pull_request'
        run: node .github/scripts/change-scope.mjs
        env:
          SCOPE_FROM: ${{ github.event.pull_request.base.sha }}
          SCOPE_TO: ${{ github.sha }}

      # After the scope decision: setup-node's pnpm cache fails its post step when no install
      # created the store.
      - if: steps.scope.outputs.docs_only != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # The project's own runners keep their pnpm store on disk; saving it from there would publish
      # whatever earlier pull requests fetched into it.
      - if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm audit
        continue-on-error: true

      - name: Read the Playwright version
        id: playwright-version
        if: steps.scope.outputs.docs_only != 'true'
        run: echo "value=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      # GitHub-hosted runners start empty: keyed on the Playwright version, not the lockfile, since
      # the browser only changes with it. Only main saves the cache, which every pull request can
      # read; a copy saved from a pull request would serve only that pull request.
      - name: Restore Playwright browsers
        id: playwright-cache
        if: steps.scope.outputs.docs_only != 'true' && runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}

      # A cache hit still needs the OS packages Playwright's browsers link against,
      # just not another download of the (unchanged) browser binary.
      - if: steps.scope.outputs.docs_only != 'true' && runner.environment == 'github-hosted' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - if: steps.scope.outputs.docs_only != 'true' && runner.environment == 'github-hosted' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Save Playwright browsers
        if: steps.scope.outputs.docs_only != 'true' && runner.environment == 'github-hosted' && github.event_name == 'push' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      # The project's own runners keep their browsers and already have the OS packages, so no job
      # runs apt there, and nothing a pull request downloads reaches the shared cache above.
      - if: steps.scope.outputs.docs_only != 'true' && runner.environment == 'self-hosted'
        run: pnpm exec playwright install chromium

      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm verify
