name: Verify

on:
  pull_request:
  push:
    branches: [main]

# On `pull_request`, a new push supersedes the run still going for its previous push. Runs on main
# get a group of their own per commit, so they are never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides whether a `pull_request` change is docs-only, the one case that may skip static below,
  # and whether the test shards read any of its changed paths; a push always runs every job in
  # full, since its success is what lets the deploy ship it and the commit before it may not have
  # passed.
  # It also scans every commit of a `pull_request` change for secrets, which a docs-only net diff
  # can hide: a failure here fails scope, and a failed scope runs static/tests in full.
  scope:
    name: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      tests_needed: ${{ steps.scope.outputs.tests_needed }}
      catalog_changed: ${{ steps.scope.outputs.catalog_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Decide the change's scope
        id: scope
        run: node .github/scripts/change-scope.mjs
        env:
          SCOPE_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SCOPE_TO: ${{ github.sha }}

      - name: Scan the change's commits for secrets
        run: node --test .github/scripts/no-secrets-in-commit-history.test.mjs
        env:
          CHANGE_BASE_REF: ${{ github.event.pull_request.base.sha }}

  # tsc, the builds, biome, dependency-cruiser and the repository's own automation tests: none of
  # these need Postgres or a browser, so this job carries no Playwright setup. Each leg runs one part
  # of verify:static, or one shard of it, so the parts run side by side.
  static:
    name: static (${{ matrix.part }})
    needs: [scope]
    # A push always runs this in full. On `pull_request`, it is skipped only when scope positively
    # decided the change is docs-only; a failed or missing scope decision falls through to running
    # it, the same fail-safe default change-scope.mjs itself applies.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: types
            command: pnpm verify:static:types
          - part: builds
            command: pnpm verify:static:builds
          - part: automation 1/2
            command: pnpm verify:static:automation
            shard: 1/2
          - part: automation 2/2
            command: pnpm verify:static:automation
            shard: 2/2
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Full history, so the migration guard among the automation tests can diff the working tree
      # against the commit this change is built on, and the secret scan can read every commit since
      # it, not just the single commit checkout otherwise fetches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit
        continue-on-error: true

      - run: ${{ matrix.command }}
        env:
          CHANGE_BASE_REF: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          TEST_SHARD: ${{ matrix.shard }}

  # The durations of the newest successful Verify run that kept them, on main or on the head branch
  # under review, downloaded once and handed to every shard below so they all split alike.
  # Finding none, or failing to look or download, must not fail the run: the shards then split by
  # file count.
  test-durations-source:
    name: test durations source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      durations: ${{ steps.source.outputs.durations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - id: source
        run: node .github/scripts/test-durations-source.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}

  # ECR Public caps what one address pulls without credentials, and shared runners share that cap:
  # the shards pull the cloud's Postgres image from a copy on ghcr.io with the run's own token.
  # Looking the copy up needs only a read-only token, which is all a Dependabot run ever gets.
  postgres-image:
    name: postgres image
    needs: [scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.tests_needed != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      packages: read
    outputs:
      mirrored: ${{ steps.mirror.outputs.mirrored }}
    steps:
      - id: mirror
        name: Look up the cloud's Postgres image on ghcr.io
        run: |
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if timeout 60 skopeo inspect --raw "docker://${POSTGRES_IMAGE%%:*}@${POSTGRES_IMAGE#*@}" > /dev/null; then
            echo "mirrored=true" >> "$GITHUB_OUTPUT"
          else
            echo "mirrored=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POSTGRES_IMAGE: ghcr.io/ljguardiola/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873

  # Copies the same digest from ECR Public only when ghcr.io does not have it yet, so the public
  # registry is pulled from once per digest instead of by every shard of every run.
  postgres-image-copy:
    name: postgres image copy
    needs: [postgres-image]
    if: ${{ needs.postgres-image.outputs.mirrored == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      packages: write
    steps:
      - name: Copy the cloud's Postgres image to ghcr.io
        timeout-minutes: 23
        run: |
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for delay in 0 15 30 60; do
            sleep "$delay"
            timeout 300 skopeo copy --all --preserve-digests "docker://${SOURCE_IMAGE%%:*}@${SOURCE_IMAGE#*@}" "docker://${POSTGRES_IMAGE%@*}" && exit 0
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_IMAGE: public.ecr.aws/docker/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          POSTGRES_IMAGE: ghcr.io/ljguardiola/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873

  # MCR can stall a layer, and shared runners pull from the same address: the tests and the visual
  # job pull the Playwright image from a copy on ghcr.io with the run's own token, and only a
  # missing copy is ever pulled from MCR, once per digest.
  playwright-image:
    name: playwright image
    needs: [scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.tests_needed != 'false' || needs.scope.outputs.catalog_changed != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      packages: read
    outputs:
      mirrored: ${{ steps.mirror.outputs.mirrored }}
    steps:
      - id: mirror
        name: Look up the Playwright image on ghcr.io
        run: |
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if timeout 60 skopeo inspect --raw "docker://${PLAYWRIGHT_SERVER_IMAGE%%:*}@${PLAYWRIGHT_SERVER_IMAGE#*@}" > /dev/null; then
            echo "mirrored=true" >> "$GITHUB_OUTPUT"
          else
            echo "mirrored=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAYWRIGHT_SERVER_IMAGE: ghcr.io/ljguardiola/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27

  playwright-image-copy:
    name: playwright image copy
    needs: [playwright-image]
    if: ${{ needs.playwright-image.outputs.mirrored == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      packages: write
    steps:
      - name: Copy the Playwright image to ghcr.io
        timeout-minutes: 43
        run: |
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for delay in 0 15 30 60; do
            sleep "$delay"
            timeout 600 skopeo copy --all --preserve-digests "docker://${SOURCE_IMAGE%%:*}@${SOURCE_IMAGE#*@}" "docker://${PLAYWRIGHT_SERVER_IMAGE%@*}" && exit 0
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
          PLAYWRIGHT_SERVER_IMAGE: ghcr.io/ljguardiola/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27

  # vitest run, sharded six ways, each shard given an even share of every project's files by their
  # durations measured on the run test-durations-source picked, so a slow shard - not the
  # ever-growing total test count - bounds this job's wall time.
  tests:
    name: tests (${{ matrix.shard }}/6)
    needs: [scope, test-durations-source, postgres-image, postgres-image-copy, playwright-image, playwright-image-copy]
    # Skipped on `pull_request` only when scope positively decided the shards read no changed path;
    # a failed or missing decision runs them, like static above.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.tests_needed != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 47
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Sign in to ghcr.io
        timeout-minutes: 2
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Pull the cloud's Postgres image
        timeout-minutes: 10
        run: |
          for delay in 0 15 30 60; do
            sleep "$delay"
            timeout 120 docker pull "$POSTGRES_IMAGE" && exit 0
          done
          exit 1
        env:
          POSTGRES_IMAGE: ghcr.io/ljguardiola/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873

      - name: Pull the Playwright image
        timeout-minutes: 22
        run: |
          for delay in 0 15 30 60; do
            sleep "$delay"
            timeout 300 docker pull "$PLAYWRIGHT_SERVER_IMAGE" && exit 0
          done
          exit 1
        env:
          PLAYWRIGHT_SERVER_IMAGE: ghcr.io/ljguardiola/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27

      - run: pnpm verify:tests --shard=${{ matrix.shard }}/6
        timeout-minutes: 15
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          TEST_DURATIONS: ${{ needs.test-durations-source.outputs.durations }}
          TEST_DURATIONS_FILE: ${{ runner.temp }}/test-durations-out/shard-${{ matrix.shard }}.json

      - name: Keep this shard's test durations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-durations-out/shard-${{ matrix.shard }}.json
          retention-days: 14
          if-no-files-found: error

  visual:
    name: visual
    needs: [scope, playwright-image, playwright-image-copy]
    if: ${{ !cancelled() && needs.scope.outputs.catalog_changed != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 37
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Sign in to ghcr.io
        timeout-minutes: 2
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Pull the Playwright image
        timeout-minutes: 22
        run: |
          for delay in 0 15 30 60; do
            sleep "$delay"
            timeout 300 docker pull "$PLAYWRIGHT_SERVER_IMAGE" && exit 0
          done
          exit 1
        env:
          PLAYWRIGHT_SERVER_IMAGE: ghcr.io/ljguardiola/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27

      - run: pnpm verify:visual
        timeout-minutes: 15
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload the actual and diff images for a failed comparison
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-visual-diff
          retention-days: 7
          path: .vitest/attachments
          if-no-files-found: ignore

  # The required status check named in .github/rulesets/main.json.
  verify:
    name: verify
    needs: [scope, static, tests, visual]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Decide whether every required job succeeded
        run: node .github/scripts/aggregate-verify-result.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          SCOPE_TESTS_NEEDED: ${{ needs.scope.outputs.tests_needed }}
          SCOPE_CATALOG_CHANGED: ${{ needs.scope.outputs.catalog_changed }}
          STATIC_RESULT: ${{ needs.static.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
