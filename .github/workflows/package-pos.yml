name: Package register

on:
  pull_request:
    paths:
      - apps/pos/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .node-version
      - .github/workflows/package-pos.yml
      - .github/scripts/same-app-code.mjs
      - .github/scripts/app-code-hash.mjs
  push:
    branches: [main]
    paths:
      - apps/pos/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .node-version
      - .github/workflows/package-pos.yml
      - .github/scripts/same-app-code.mjs
      - .github/scripts/app-code-hash.mjs

# A new push to a pull request supersedes the run still going for its previous push. Runs on main
# get a group of their own per commit, so they are never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    # Only a merge to main builds an installer: the staging one, under the staging environment,
    # which admits nothing but main. Pull requests package both channels' app code with no
    # credentials and no installer. The job builds the app code once and packages both channels
    # from it, but only the pack:staging step below reads the staging environment's Sentry DSN and
    # update feed URL — pack:production never receives them. The production installer comes from
    # the tag-bound release workflow.
    environment: ${{ github.event_name == 'push' && 'staging' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit
        continue-on-error: true

      - run: pnpm --filter @purosur/pos build

      # The built app code carries nothing channel-specific; the channel, its Sentry DSN and its
      # update feed only reach each channel's resources/channel.json and app-update.yml, outside
      # app.asar. An unset variable leaves that feature off. --dir stops at the unpacked app, which
      # is all the app code comparisons below read.
      - run: pnpm --filter @purosur/pos pack:production --dir
        env:
          POS_SENTRY_DSN: ""
          POS_UPDATE_FEED_URL: ""

      # The staging feed is a separate artifact in the staging bucket. The DSN reaches only the job
      # running under the staging environment (a push to main), which is also the only run that
      # builds the staging installer.
      - run: pnpm --filter @purosur/pos pack:staging ${{ github.event_name == 'pull_request' && '--dir' || '' }}
        env:
          POS_SENTRY_DSN: ${{ github.event_name == 'push' && vars.POS_SENTRY_DSN || '' }}
          POS_UPDATE_FEED_URL: ${{ vars.POS_UPDATE_FEED_URL }}

      # Each channel's unpacked folder holds its app code, so both can be compared directly.
      - name: Compare the two channels' app.asar
        run: >-
          node .github/scripts/same-app-code.mjs
          apps/pos/release/production/win-unpacked/resources/app.asar
          apps/pos/release/staging/win-unpacked/resources/app.asar

      - if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pos-staging-installer
          retention-days: 7
          path: apps/pos/release/staging/*.exe
          if-no-files-found: error

      - name: Upload the production app.asar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pos-production-app-asar
          retention-days: 1
          path: apps/pos/release/production/win-unpacked/resources/app.asar
          if-no-files-found: error

      # Runs the unpacked app from the same out/ both channels packaged. It reads a channel file
      # the test writes itself, with no DSN, so the deliberate core kill and invalid message never
      # reach Sentry.
      - run: pnpm --filter @purosur/pos test:e2e

  independent-build:
    name: independent build of the production app.asar
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @purosur/pos build

      - run: pnpm --filter @purosur/pos pack:production --dir
        env:
          POS_SENTRY_DSN: ""
          POS_UPDATE_FEED_URL: ""

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pos-independent-production-app-asar
          retention-days: 1
          path: apps/pos/release/production/win-unpacked/resources/app.asar
          if-no-files-found: error

  independent-build-agrees:
    name: independent build agrees on app code
    needs: [package, independent-build]
    if: github.event_name == 'push'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-24.04"') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pos-production-app-asar
          path: package-build

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pos-independent-production-app-asar
          path: independent-build

      - name: Compare the two builds' production app.asar
        run: >-
          node .github/scripts/same-app-code.mjs
          package-build/app.asar
          independent-build/app.asar
