name: Package register

on:
  pull_request:
    paths:
      - apps/pos/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .node-version
      - .github/workflows/package-pos.yml
  push:
    branches: [main]
    paths:
      - apps/pos/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .node-version
      - .github/workflows/package-pos.yml

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.channel }})
    runs-on: windows-latest
    # Only a merge to main packages the staging installer under the staging environment, which
    # admits nothing but main; pull requests package both channels with no credentials at all. The
    # production installer that carries credentials comes from the tag-bound release workflow.
    environment: ${{ (github.event_name == 'push' && matrix.channel == 'staging') && 'staging' || '' }}
    strategy:
      matrix:
        channel: [production, staging]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit
        continue-on-error: true

      # The app code is built with nothing channel-specific in it; the channel, its Sentry DSN and
      # its update feed only reach the installer's resources/channel.json and app-update.yml,
      # outside app.asar. An unset variable leaves that feature off in the installer. The staging
      # feed is a separate artifact in the staging bucket, so only the staging channel's job ever
      # carries it; a production installer, on a PR or on main, never gets a value here.
      - run: pnpm --filter @purosur/pos package:${{ matrix.channel }}
        env:
          POS_SENTRY_DSN: ${{ vars.POS_SENTRY_DSN }}
          POS_UPDATE_FEED_URL: ${{ matrix.channel == 'staging' && vars.POS_UPDATE_FEED_URL || '' }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pos-${{ matrix.channel }}-installer
          path: apps/pos/release/${{ matrix.channel }}/*.exe
          if-no-files-found: error

      # electron-builder leaves the folder the installer was built from next to it.
      - name: Hash the packaged app code
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          sha256sum "apps/pos/release/$CHANNEL/win-unpacked/resources/app.asar" | cut -d ' ' -f 1 > "app-asar-$CHANNEL.sha256"
          cat "app-asar-$CHANNEL.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pos-${{ matrix.channel }}-app-asar-sha256
          path: app-asar-${{ matrix.channel }}.sha256
          if-no-files-found: error

      # Runs the unpacked app from the same out/ the installer packaged. It reads a channel file
      # the test writes itself, with no DSN, so the deliberate core kill and invalid message never
      # reach Sentry.
      - run: pnpm --filter @purosur/pos test:e2e

  same-app-code:
    name: same app code in both channels
    needs: package
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pos-*-app-asar-sha256
          path: hashes
          merge-multiple: true

      - name: Compare the two channels' app.asar
        run: |
          production="$(cat hashes/app-asar-production.sha256)"
          staging="$(cat hashes/app-asar-staging.sha256)"
          echo "production: $production"
          echo "staging:    $staging"
          if [ -z "$production" ] || [ "$production" != "$staging" ]; then
            echo "::error::app.asar differs between the production and staging installers"
            exit 1
          fi

