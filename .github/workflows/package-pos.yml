name: Package register

on:
  pull_request:
    paths:
      - apps/pos/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .node-version
      - .github/workflows/package-pos.yml
  push:
    branches: [main]
    paths:
      - apps/pos/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .node-version
      - .github/workflows/package-pos.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    # Only a merge to main packages the staging installer under the staging environment, which
    # admits nothing but main; pull requests package both channels with no credentials at all. The
    # job builds the app code once and packages both channels from it, but only the package:staging
    # step below reads the staging environment's Sentry DSN and update feed URL — package:production
    # never receives them, on a pull request or on main. The production installer that carries
    # credentials comes from the tag-bound release workflow.
    environment: ${{ github.event_name == 'push' && 'staging' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit
        continue-on-error: true

      - run: pnpm --filter @purosur/pos build

      # The built app code carries nothing channel-specific; the channel, its Sentry DSN and its
      # update feed only reach each installer's resources/channel.json and app-update.yml, outside
      # app.asar. An unset variable leaves that feature off in the installer. The production
      # installer, on a pull request or on main, never gets a DSN or a feed here.
      - run: pnpm --filter @purosur/pos package:production
        env:
          POS_SENTRY_DSN: ""
          POS_UPDATE_FEED_URL: ""

      # The staging feed is a separate artifact in the staging bucket. The DSN reaches only the job
      # running under the staging environment (a push to main), so no pull request installer ever
      # reports to Sentry.
      - run: pnpm --filter @purosur/pos package:staging
        env:
          POS_SENTRY_DSN: ${{ github.event_name == 'push' && vars.POS_SENTRY_DSN || '' }}
          POS_UPDATE_FEED_URL: ${{ vars.POS_UPDATE_FEED_URL }}

      # electron-builder leaves the folder each installer was built from next to it, so both
      # channels' app code can be compared directly without unpacking the installer.
      - name: Compare the two channels' app.asar
        run: >-
          node .github/scripts/same-app-code.mjs
          apps/pos/release/production/win-unpacked/resources/app.asar
          apps/pos/release/staging/win-unpacked/resources/app.asar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pos-production-installer
          path: apps/pos/release/production/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pos-staging-installer
          path: apps/pos/release/staging/*.exe
          if-no-files-found: error

      # Feeds the independent-build job below, which only runs on push: a second, independent build
      # of this same commit needs this exact app.asar to compare itself against.
      - name: Upload the production app.asar for the independent-build check
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pos-production-app-asar
          path: apps/pos/release/production/win-unpacked/resources/app.asar
          if-no-files-found: error
          retention-days: 1

      # Runs the unpacked app from the same out/ both installers packaged. It reads a channel file
      # the test writes itself, with no DSN, so the deliberate core kill and invalid message never
      # reach Sentry.
      - run: pnpm --filter @purosur/pos test:e2e

  # Two independent builds of the same commit must produce the same app code. Pull requests skip
  # this second build to stay cheap; every change that reaches main still gets it.
  independent-build:
    name: independent build agrees on app code
    needs: package
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @purosur/pos build

      # Unpacked only: no installer, no credentials, this only needs the app code inside app.asar.
      - run: pnpm --filter @purosur/pos package:production --dir
        env:
          POS_SENTRY_DSN: ""
          POS_UPDATE_FEED_URL: ""

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pos-production-app-asar
          path: independent-build

      - name: Compare against the package job's production app.asar
        run: >-
          node .github/scripts/same-app-code.mjs
          apps/pos/release/production/win-unpacked/resources/app.asar
          independent-build/app.asar
