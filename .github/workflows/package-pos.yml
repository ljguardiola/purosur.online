name: Package register

on:
  pull_request:
    paths:
      - apps/pos/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .node-version
      - .github/workflows/package-pos.yml
      - .github/scripts/same-app-code.mjs
      - .github/scripts/app-code-hash.mjs
      - .github/scripts/publish-pos-update.mjs
      - .github/scripts/register-candidate.mjs
  push:
    branches: [main]
    paths:
      - apps/pos/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .node-version
      - .github/workflows/package-pos.yml
      - .github/scripts/same-app-code.mjs
      - .github/scripts/app-code-hash.mjs
      - .github/scripts/publish-pos-update.mjs
      - .github/scripts/register-candidate.mjs

# On `pull_request`, a new push supersedes the run still going for its previous push. Runs on main
# get a group of their own per commit, so they are never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 12
    # Every run builds both channels' installers, so a change that breaks either one fails before
    # it merges. Only a merge to main runs under the staging environment, which admits nothing but
    # main, and keeps both installers. The job builds the app code once and packages both channels
    # from it. The staging Sentry DSN is read only by the pack:staging step, from the staging
    # environment; the production DSN and cloud are repository variables a push to main reads, as
    # that is where the production installer that ships is built.
    environment: ${{ github.event_name == 'push' && 'staging' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit
        continue-on-error: true

      - run: pnpm --filter @purosur/pos build

      # The built app code carries nothing channel-specific; the channel, its Sentry DSN and its
      # cloud only reach each channel's resources/channel.json, outside app.asar. An unset variable
      # leaves that feature off.
      - run: pnpm --filter @purosur/pos pack:production
        env:
          POS_VERSION: 0.0.${{ github.run_number }}
          POS_SENTRY_DSN: ${{ github.event_name == 'push' && vars.POS_PRODUCTION_SENTRY_DSN || '' }}
          POS_CLOUD_URL: ${{ github.event_name == 'push' && vars.POS_PRODUCTION_CLOUD_URL || '' }}

      # The DSN reaches only the job running under the staging environment (a push to main), which
      # is also the only run that keeps the staging installer.
      - run: pnpm --filter @purosur/pos pack:staging
        env:
          POS_VERSION: 0.0.${{ github.run_number }}
          POS_SENTRY_DSN: ${{ github.event_name == 'push' && vars.POS_SENTRY_DSN || '' }}
          POS_CLOUD_URL: ${{ vars.POS_CLOUD_URL }}

      # Each channel's unpacked folder holds its app code, so both can be compared directly.
      - name: Compare the two channels' app.asar
        run: >-
          node .github/scripts/same-app-code.mjs
          apps/pos/release/production/win-unpacked/resources/app.asar
          apps/pos/release/staging/win-unpacked/resources/app.asar

      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pos-staging-installer
          retention-days: 7
          path: apps/pos/release/staging/*.exe
          if-no-files-found: error

      - name: Upload the production installer
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pos-production-installer
          retention-days: 1
          path: apps/pos/release/production/*.exe
          if-no-files-found: error

      - name: Upload the production app.asar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pos-production-app-asar
          retention-days: 1
          path: apps/pos/release/production/win-unpacked/resources/app.asar
          if-no-files-found: error

      # Runs the unpacked app from the same out/ both channels packaged. It reads a channel file
      # the test writes itself, with no DSN, so the deliberate core kill and invalid message never
      # reach Sentry.
      - run: pnpm --filter @purosur/pos test:e2e

      # Starts the staging build pack:staging left in release/staging/win-unpacked, so a native
      # binding the packaged app cannot load fails here and not on a store's register. It rewrites
      # that folder's channel.json without a DSN or cloud, and runs after every step that reads it.
      - run: pnpm --filter @purosur/pos test:packaged
        env:
          POS_VERSION: 0.0.${{ github.run_number }}

  independent-build:
    name: independent build of the production app.asar
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @purosur/pos build

      - run: pnpm --filter @purosur/pos pack:production --dir
        env:
          POS_VERSION: 0.0.${{ github.run_number }}
          POS_SENTRY_DSN: ""
          POS_CLOUD_URL: ""

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pos-independent-production-app-asar
          retention-days: 1
          path: apps/pos/release/production/win-unpacked/resources/app.asar
          if-no-files-found: error

  independent-build-agrees:
    name: independent build agrees on app code
    needs: [package, independent-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pos-production-app-asar
          path: package-build

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pos-independent-production-app-asar
          path: independent-build

      - name: Compare the two builds' production app.asar
        run: >-
          node .github/scripts/same-app-code.mjs
          package-build/app.asar
          independent-build/app.asar

  # The staging feed only ever serves an installer whose candidate this same attempt stored, so the
  # installer validated in staging is the one stored beside the production installer it promotes.
  publish-staging-update:
    name: publish the staging installer to the update feed
    needs: [package, independent-build-agrees, store-candidate]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
    # Two merges never write the feed at once, and a later run waits for the earlier one instead of
    # cancelling it halfway through an upload.
    concurrency:
      group: pos-staging-update-feed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pos-staging-installer
          path: staging-installer

      # Publishing stays off until the staging environment names its bucket.
      - name: Publish the installer, then the feed entry that points at it
        if: vars.POS_UPDATES_BUCKET_NAME != ''
        run: node .github/scripts/publish-pos-update.mjs staging-installer
        env:
          POS_VERSION: 0.0.${{ github.run_number }}
          POS_UPDATES_BUCKET_NAME: ${{ vars.POS_UPDATES_BUCKET_NAME }}
          POS_UPDATES_BUCKET_ENDPOINT: ${{ vars.POS_UPDATES_BUCKET_ENDPOINT }}
          POS_UPDATES_BUCKET_REGION: ${{ vars.POS_UPDATES_BUCKET_REGION }}
          POS_UPDATES_BUCKET_ACCESS_KEY_ID: ${{ secrets.POS_UPDATES_BUCKET_ACCESS_KEY_ID }}
          POS_UPDATES_BUCKET_SECRET_ACCESS_KEY: ${{ secrets.POS_UPDATES_BUCKET_SECRET_ACCESS_KEY }}

  store-candidate:
    name: store the production installer as a release candidate
    needs: [package, independent-build-agrees]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pos-production-installer
          path: candidate/installer

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pos-staging-installer
          path: candidate/staging-installer

      - name: Record the commit, the installer version and the staging installer's digest
        env:
          TARGET_SHA: ${{ github.sha }}
          POS_VERSION: 0.0.${{ github.run_number }}
          MANIFEST_FILE: candidate/candidate.json
          STAGING_INSTALLER_DIR: candidate/staging-installer
        run: node .github/scripts/register-candidate.mjs write-manifest

      - name: Name the candidate image
        id: candidate
        env:
          INSTALLER_VERSION: 0.0.${{ github.run_number }}
        run: node .github/scripts/register-candidate.mjs run-of-version

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      # A re-run of a merge run keeps its run number but builds new installers; the candidate
      # stored first stays the only one that number names.
      - name: Refuse to replace a candidate already stored
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
        run: |
          if fetched=$(oras manifest fetch --descriptor "$CANDIDATE_IMAGE" 2>&1); then
            echo "::error::$CANDIDATE_IMAGE already holds a candidate"
            exit 1
          fi
          if ! grep -q "not found" <<< "$fetched"; then
            echo "$fetched" >&2
            exit 1
          fi

      - name: Push the candidate
        working-directory: candidate
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
          TARGET_SHA: ${{ github.sha }}
        run: >-
          oras push "$CANDIDATE_IMAGE"
          --artifact-type application/vnd.purosur.pos-candidate.v1
          --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --annotation "org.opencontainers.image.revision=$TARGET_SHA"
          candidate.json installer/*.exe staging-installer/*.exe
