name: Package register

on:
  pull_request:
    paths:
      - apps/pos/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .node-version
      - .github/workflows/package-pos.yml
  push:
    branches: [main]
    paths:
      - apps/pos/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .node-version
      - .github/workflows/package-pos.yml

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.channel }})
    runs-on: windows-latest
    # Each channel's credentials live in its own environment under the same variable names.
    environment: pos-${{ matrix.channel }}
    strategy:
      matrix:
        channel: [production, homologation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # An unset variable leaves that feature off in the installer.
      - run: pnpm --filter @purosur/pos package:${{ matrix.channel }}
        env:
          MAIN_VITE_SENTRY_DSN: ${{ vars.POS_SENTRY_DSN }}
          RENDERER_VITE_SENTRY_DSN: ${{ vars.POS_SENTRY_DSN }}
          POS_UPDATE_FEED_URL: ${{ vars.POS_UPDATE_FEED_URL }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pos-${{ matrix.channel }}-installer
          path: apps/pos/release/${{ matrix.channel }}/*.exe
          if-no-files-found: error

      # This job's environment carries the channel's real Sentry DSN; the e2e run deliberately
      # kills the core and sends it an invalid message, so it must never share that build. This
      # rebuild leaves both Sentry env vars unset (Sentry disabled) and only proves the shell,
      # never packages it — the installer above already came from the real per-channel build.
      - run: pnpm --filter @purosur/pos build

      - run: pnpm --filter @purosur/pos test:e2e
