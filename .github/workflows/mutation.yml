name: Mutation

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "30"

jobs:
  shard:
    name: mutation (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        env:
          npm_config_audit: "false"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # A cache download can stall and hang its step until the job times out; past this limit the
      # job installs without the cache instead.
      - name: Restore the pnpm store
        id: restore-pnpm-store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile --filter purosur-pos --filter @purosur/contracts --filter @purosur/domain

      - run: |
          files=$(node .github/scripts/mutation-shard.mjs)
          pnpm mutation --mutate "$files"
        env:
          MUTATION_SHARD_INDEX: ${{ strategy.job-index }}
          MUTATION_SHARD_TOTAL: ${{ strategy.job-total }}

  mutation:
    name: mutation
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Decide whether every shard tested its mutants and caught them all
        run: test "$SHARDS_RESULT" = success
        env:
          SHARDS_RESULT: ${{ needs.shard.result }}
