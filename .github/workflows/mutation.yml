name: Mutation

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: full concurrency ${{ matrix.concurrency }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        concurrency: [6, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter purosur-pos --filter @purosur/contracts --filter @purosur/domain

      - run: nproc && free -g

      - run: pnpm mutation --concurrency "$CONCURRENCY"
        env:
          CONCURRENCY: ${{ matrix.concurrency }}

  shard:
    name: shard ${{ matrix.shard }}/3 concurrency ${{ matrix.concurrency }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
        concurrency: [default, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter purosur-pos --filter @purosur/contracts --filter @purosur/domain

      - run: |
          files=$(node -e 'const fs=require("fs");const f=fs.globSync(["packages/domain/src/**/*.ts","packages/contracts/src/**/*.ts"]).filter(p=>!p.endsWith(".test.ts")&&!p.includes("/test-support/")).sort();console.log(f.filter((_,i)=>i%3===Number(process.argv[1])).join(","))' "$SHARD")
          if [ "$CONCURRENCY" = default ]; then
            pnpm mutation --mutate "$files"
          else
            pnpm mutation --mutate "$files" --concurrency "$CONCURRENCY"
          fi
        env:
          SHARD: ${{ matrix.shard }}
          CONCURRENCY: ${{ matrix.concurrency }}
