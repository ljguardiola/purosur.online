name: Deploy cloud to staging

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time: `railway config apply` and the wait it triggers must never overlap with
# another run's apply against the same environment. A pending run cancelled by a newer one loses
# nothing, because every run deploys main's newest verified commit and deploys whenever the
# previous run did not succeed.
concurrency:
  group: deploy-cloud-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build and push image
    # Verify also runs on pull_request; only a passing push run on main may deploy. A manual
    # dispatch forces an apply of main's newest verified commit (e.g. after changing a secret,
    # with no new push to react to) and is safe because the target is always a verified commit.
    # Both jobs carry this gate.
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image-ref.outputs.value }}
      sha: ${{ steps.target.outputs.sha }}
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      # main's live tip, not the event's github.sha: a manual re-run of an old run keeps its
      # original github.sha and would otherwise not see commits verified since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Resolve the newest verified commit on main
        id: target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGERING_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node .github/scripts/newest-verified-commit.mjs

      - name: Check out the commit to deploy
        run: git checkout --detach "${{ steps.target.outputs.sha }}"

      - name: Decide whether this changed anything the cloud image or staging is built from
        id: changes
        env:
          CLOUD_HEALTH_DOMAIN: staging.purosur.online
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/cloud-changed.mjs

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changes.outputs.deploy == 'true'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.changes.outputs.deploy == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds once and pushes the same digest this whole pipeline deploys; the commit-SHA tag is
      # only for humans browsing GHCR, Railway is given the digest below.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        if: steps.changes.outputs.deploy == 'true'
        with:
          context: .
          file: apps/cloud/Dockerfile
          push: true
          tags: ghcr.io/ljguardiola/purosur-cloud:${{ steps.target.outputs.sha }}
          build-args: |
            APP_VERSION=${{ steps.target.outputs.sha }}

      - name: Resolve the exact image reference
        id: image-ref
        if: steps.changes.outputs.deploy == 'true'
        run: echo "value=ghcr.io/ljguardiola/purosur-cloud@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: apply and deploy to staging
    needs: build
    if: ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Needed so the CLI's Node evaluator can resolve `import ... from "railway/iac"` inside
      # .railway/railway.ts.
      - run: pnpm install --frozen-lockfile

      # The package's postinstall downloads the platform binary from GitHub releases, which can
      # fail transiently.
      - name: Install the Railway CLI
        run: |
          for attempt in 1 2 3; do
            if npm install -g @railway/cli@5.58.0; then
              exit 0
            fi
            echo "npm install -g @railway/cli failed (attempt $attempt/3)"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "::error::npm install -g @railway/cli failed after 3 attempts"
          exit 1

      - name: Record when the apply starts
        id: apply-started
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # `RAILWAY_TOKEN` is a project token scoped to the staging environment, so it alone resolves
      # project and environment. `apply` is not atomic: a failed apply may have created some
      # resources, and re-running it converges.
      - name: Apply the staging infrastructure
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          CLOUD_IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          CLOUD_SENTRY_DSN: ${{ vars.CLOUD_SENTRY_DSN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EDGE_ORIGIN_SECRET: ${{ secrets.EDGE_ORIGIN_SECRET }}
          CLOUD_APP_DATABASE_PASSWORD: ${{ secrets.CLOUD_APP_DATABASE_PASSWORD }}
          AUTHORIZED_CUIT: ${{ secrets.AUTHORIZED_CUIT }}
        # Without --confirm-destructive, a plan that destroys or replaces a resource fails here.
        run: railway config apply --json --yes

      - name: Wait for the new deployment to succeed
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: Cloud Server
          RAILWAY_ENVIRONMENT: staging
          CLOUD_IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          RAILWAY_APPLY_STARTED_AT: ${{ steps.apply-started.outputs.value }}
          RAILWAY_DEPLOYMENT_TIMEOUT_SECONDS: "600"
        run: node .github/scripts/railway-deployment-wait.mjs

      - name: Verify the deployed version on the staging domain
        env:
          CLOUD_HEALTH_DOMAIN: staging.purosur.online
          CLOUD_HEALTH_EXPECTED_VERSION: ${{ needs.build.outputs.sha }}
        run: node .github/scripts/verify-cloud-health.mjs
