name: Deploy cloud to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time: `railway config apply` and the wait it triggers must never overlap with
# another run's apply against the same environment.
concurrency:
  group: deploy-cloud-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image-ref.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit
        continue-on-error: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds once and pushes the same digest this whole pipeline deploys; the commit-SHA tag is
      # only for humans browsing GHCR, Railway is given the digest below.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: apps/cloud/Dockerfile
          push: true
          tags: ghcr.io/ljguardiola/purosur-cloud:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}

      - name: Resolve the exact image reference
        id: image-ref
        run: echo "value=ghcr.io/ljguardiola/purosur-cloud@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: apply and deploy to staging
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Needed so the CLI's Node evaluator can resolve `import ... from "railway/iac"` inside
      # .railway/railway.ts.
      - run: pnpm install --frozen-lockfile

      - name: Install the Railway CLI
        run: npm install -g @railway/cli@5.58.0

      # Captured strictly before `apply` runs, so "wait for the new deployment" below never has to
      # guess whether its own first read (which necessarily happens after apply) beat Railway to
      # recording the brand-new deployment. On the very first-ever run the service does not exist
      # yet at this point either; the script reads that failure the same as "no deployment yet"
      # (confirmed live: `railway domain list` on a project with no services exits 1 with plain
      # text, not `[]` - the deployment list command is not assumed to behave differently).
      - name: Capture the deployment recorded before apply
        id: pre-apply-deployment
        env:
          RAILWAY_SERVICE: cloud
          RAILWAY_ENVIRONMENT: staging
        run: node .github/scripts/railway-deployment-wait.mjs --print-newest

      # `RAILWAY_TOKEN` is a project token already scoped to the staging environment (provisioned
      # out of band), so `railway config apply` needs no `railway link` step and no --environment
      # flag - the token alone resolves project and environment. On the first-ever run this apply
      # creates postgres, the bucket and the cloud service itself, from the image built above.
      - name: Apply the staging infrastructure
        env:
          CLOUD_IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          CLOUD_SENTRY_DSN: ${{ vars.CLOUD_SENTRY_DSN }}
        # No --confirm-destructive: a plan that would destroy or replace an existing resource
        # fails this step instead of applying unattended, and needs a human to review it.
        run: railway config apply --json --yes

      - name: Wait for the new deployment to succeed
        env:
          RAILWAY_SERVICE: cloud
          RAILWAY_ENVIRONMENT: staging
          RAILWAY_DEPLOYMENT_TIMEOUT_SECONDS: "600"
          RAILWAY_PREVIOUS_DEPLOYMENT_ID: ${{ steps.pre-apply-deployment.outputs.deployment_id }}
        run: node .github/scripts/railway-deployment-wait.mjs

      # Railway's IaC reference has no field for a generated *.up.railway.app domain ("Generated
      # Railway service domains are not included in .railway/railway.ts"), so it is not declared
      # in .railway/railway.ts; CI ensures one exists here instead, every run, since generating a
      # second one is never attempted once the service already has one ("One Railway-provided
      # domain per service").
      - name: Ensure the staging domain
        id: domain
        env:
          RAILWAY_SERVICE: cloud
          RAILWAY_ENVIRONMENT: staging
        run: node .github/scripts/railway-ensure-domain.mjs

      - name: Verify the deployed version on the staging domain
        env:
          CLOUD_HEALTH_DOMAIN: ${{ steps.domain.outputs.domain }}
          CLOUD_HEALTH_EXPECTED_VERSION: ${{ github.sha }}
        run: node .github/scripts/verify-cloud-health.mjs
