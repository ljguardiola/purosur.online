name: Deploy cloud to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time: `railway config apply` and the wait it triggers must never overlap with
# another run's apply against the same environment.
concurrency:
  group: deploy-cloud-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build and push image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image-ref.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit
        continue-on-error: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds once and pushes the same digest this whole pipeline deploys; the commit-SHA tag is
      # only for humans browsing GHCR, Railway is given the digest below.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: apps/cloud/Dockerfile
          push: true
          tags: ghcr.io/ljguardiola/purosur-cloud:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}

      - name: Resolve the exact image reference
        id: image-ref
        run: echo "value=ghcr.io/ljguardiola/purosur-cloud@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: apply and deploy to staging
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Needed so the CLI's Node evaluator can resolve `import ... from "railway/iac"` inside
      # .railway/railway.ts.
      - run: pnpm install --frozen-lockfile

      # The package's postinstall downloads the platform binary from GitHub releases, which can
      # fail transiently.
      - name: Install the Railway CLI
        run: |
          for attempt in 1 2 3; do
            if npm install -g @railway/cli@5.58.0; then
              exit 0
            fi
            echo "npm install -g @railway/cli failed (attempt $attempt/3)"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "::error::npm install -g @railway/cli failed after 3 attempts"
          exit 1

      - name: Record when the apply starts
        id: apply-started
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # `RAILWAY_TOKEN` is a project token scoped to the staging environment, so it alone resolves
      # project and environment. `apply` is not atomic: a failed apply may have created some
      # resources, and re-running it converges.
      - name: Apply the staging infrastructure
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          CLOUD_IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          CLOUD_SENTRY_DSN: ${{ vars.CLOUD_SENTRY_DSN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        # Without --confirm-destructive, a plan that destroys or replaces a resource fails here.
        run: railway config apply --json --yes

      - name: Wait for the new deployment to succeed
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: cloud
          RAILWAY_ENVIRONMENT: staging
          CLOUD_IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          RAILWAY_APPLY_STARTED_AT: ${{ steps.apply-started.outputs.value }}
          RAILWAY_DEPLOYMENT_TIMEOUT_SECONDS: "600"
        run: node .github/scripts/railway-deployment-wait.mjs

      - name: Verify the deployed version on the staging domain
        env:
          CLOUD_HEALTH_DOMAIN: staging.purosur.online
          CLOUD_HEALTH_EXPECTED_VERSION: ${{ github.sha }}
        run: node .github/scripts/verify-cloud-health.mjs
