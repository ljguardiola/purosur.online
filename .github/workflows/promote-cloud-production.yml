name: Promote cloud to production

# Dispatched only against a cloud release tag: the production environment admits no other ref, and
# every job also refuses any other ref. A tag created by hand is dispatched the same way and gets
# every check.
on:
  workflow_dispatch:

concurrency:
  group: promote-cloud-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: resolve the validated build behind the tag
    if: startsWith(github.ref, 'refs/tags/cloud-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ github.ref_name }}
      image_ref: ${{ steps.digest.outputs.image_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Resolve the commit the tag points at
        id: commit
        run: echo "sha=$(git rev-parse "$GITHUB_REF^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Name the image staging validated for that commit
        id: validated
        env:
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: node .github/scripts/staging-validated-image.mjs tag

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require the validated image and read its digest
        env:
          VALIDATED_IMAGE: ${{ steps.validated.outputs.image }}
          MANIFEST_FILE: ${{ runner.temp }}/validated-manifest.json
        run: docker buildx imagetools inspect --format '{{json .Manifest}}' "$VALIDATED_IMAGE" > "$MANIFEST_FILE"

      - name: Resolve the image digest
        id: digest
        env:
          MANIFEST_FILE: ${{ runner.temp }}/validated-manifest.json
        run: node .github/scripts/staging-validated-image.mjs digest

  baseline:
    name: find the release production serves now
    if: startsWith(github.ref, 'refs/tags/cloud-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    outputs:
      previous_tag: ${{ steps.baseline.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # The package's postinstall downloads the platform binary from GitHub releases, which can
      # fail transiently.
      - name: Install the Railway CLI
        run: |
          for attempt in 1 2 3; do
            if npm install -g @railway/cli@5.58.0; then
              exit 0
            fi
            echo "npm install -g @railway/cli failed (attempt $attempt/3)"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "::error::npm install -g @railway/cli failed after 3 attempts"
          exit 1

      - name: Name the release of the commit production reports
        id: baseline
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: Cloud Server
          RAILWAY_ENVIRONMENT: production
          PRODUCTION_DOMAIN: purosur.online
          RELEASE_TAG_PREFIX: cloud-v
        run: node .github/scripts/production-baseline.mjs

  previous-contract:
    name: previous release's route tests on the new schema
    needs: [resolve, baseline]
    if: startsWith(github.ref, 'refs/tags/cloud-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PREVIOUS_TAG: ${{ needs.baseline.outputs.previous_tag }}
    steps:
      - name: Note that there is no previous release
        if: env.PREVIOUS_TAG == ''
        run: echo "No previous release, so there is no contract to hold."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PREVIOUS_TAG != ''
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.PREVIOUS_TAG != ''
        with:
          node-version-file: .node-version

      # Outside the workspace, so pnpm treats it as a workspace root of its own.
      - name: Check out the previous release beside this one
        if: env.PREVIOUS_TAG != ''
        run: git worktree add --detach "$RUNNER_TEMP/previous" "refs/tags/$PREVIOUS_TAG"

      # The previous release's tests then run on the schema the new release migrates to.
      - name: Give the previous release the new release's migrations
        if: env.PREVIOUS_TAG != ''
        env:
          PREVIOUS_DIR: ${{ runner.temp }}/previous
          CURRENT_DIR: ${{ github.workspace }}
        run: node .github/scripts/previous-release-contract.mjs swap-migrations

      - name: List the previous release's route tests
        if: env.PREVIOUS_TAG != ''
        env:
          PREVIOUS_DIR: ${{ runner.temp }}/previous
        run: node .github/scripts/previous-release-contract.mjs list > "$RUNNER_TEMP/route-tests.txt"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.PREVIOUS_TAG != ''

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.PREVIOUS_TAG != ''
        with:
          node-version-file: ${{ runner.temp }}/previous/.node-version

      - name: Install the previous release's dependencies
        if: env.PREVIOUS_TAG != ''
        working-directory: ${{ runner.temp }}/previous
        run: pnpm install --frozen-lockfile

      - name: Run the previous release's route tests
        if: env.PREVIOUS_TAG != ''
        working-directory: ${{ runner.temp }}/previous
        run: xargs -a "$RUNNER_TEMP/route-tests.txt" pnpm exec vitest run --project node

  register-minimum:
    name: no active register falls below a raised minimum version
    needs: [resolve, baseline]
    if: startsWith(github.ref, 'refs/tags/cloud-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Compare the minimum register version with the registers in the field
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          PREVIOUS_TAG: ${{ needs.baseline.outputs.previous_tag }}
          PRODUCTION_ORIGIN: https://purosur.online
          RELEASE_CHECK_TOKEN: ${{ secrets.RELEASE_CHECK_TOKEN }}
        run: node .github/scripts/register-minimum-check.mjs

  promote:
    name: deploy the validated image to production and tag it with the release
    needs: [resolve, previous-contract, register-minimum]
    if: startsWith(github.ref, 'refs/tags/cloud-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Needed so the CLI's Node evaluator can resolve `import ... from "railway/iac"` inside
      # .railway/railway.ts.
      - run: pnpm install --frozen-lockfile

      # The package's postinstall downloads the platform binary from GitHub releases, which can
      # fail transiently.
      - name: Install the Railway CLI
        run: |
          for attempt in 1 2 3; do
            if npm install -g @railway/cli@5.58.0; then
              exit 0
            fi
            echo "npm install -g @railway/cli failed (attempt $attempt/3)"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "::error::npm install -g @railway/cli failed after 3 attempts"
          exit 1

      - name: Record when the apply starts
        id: apply-started
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # `RAILWAY_TOKEN` is a project token scoped to the production environment, so it alone
      # resolves project and environment. `apply` is not atomic: a failed apply may have created
      # some resources, and re-running it converges.
      - name: Apply the production infrastructure
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          CLOUD_IMAGE_REF: ${{ needs.resolve.outputs.image_ref }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          CLOUD_SENTRY_DSN: ${{ vars.CLOUD_SENTRY_DSN }}
          BACKOFFICE_SENTRY_DSN: ${{ vars.BACKOFFICE_SENTRY_DSN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EDGE_ORIGIN_SECRET: ${{ secrets.EDGE_ORIGIN_SECRET }}
          DEVICE_TOKEN_ROTATION_KEY: ${{ secrets.DEVICE_TOKEN_ROTATION_KEY }}
          INSTALLATION_KEYS_ENCRYPTION_KEY: ${{ secrets.INSTALLATION_KEYS_ENCRYPTION_KEY }}
          CLOUD_APP_DATABASE_PASSWORD: ${{ secrets.CLOUD_APP_DATABASE_PASSWORD }}
          ARCA_CERTIFICATE: ${{ secrets.ARCA_CERTIFICATE }}
          ARCA_PRIVATE_KEY: ${{ secrets.ARCA_PRIVATE_KEY }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          MERCADOPAGO_QR_EXTERNAL_POS_ID: ${{ vars.MERCADOPAGO_QR_EXTERNAL_POS_ID }}
          MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
          RELEASE_CHECK_TOKEN: ${{ secrets.RELEASE_CHECK_TOKEN }}
        # Without --confirm-destructive, a plan that destroys or replaces a resource fails here.
        run: railway config apply --json --yes

      - name: Wait for the new deployment to succeed
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: Cloud Server
          RAILWAY_ENVIRONMENT: production
          CLOUD_IMAGE_REF: ${{ needs.resolve.outputs.image_ref }}
          RAILWAY_APPLY_STARTED_AT: ${{ steps.apply-started.outputs.value }}
          RAILWAY_DEPLOYMENT_TIMEOUT_SECONDS: "600"
        run: node .github/scripts/railway-deployment-wait.mjs

      - name: Verify the deployed version on the production domain
        env:
          CLOUD_HEALTH_DOMAIN: purosur.online
          CLOUD_HEALTH_EXPECTED_VERSION: ${{ needs.resolve.outputs.sha }}
        run: node .github/scripts/verify-cloud-health.mjs

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release's own tag on the exact digest staging validated; nothing is rebuilt.
      - name: Tag the validated digest with the release
        env:
          SOURCE_IMAGE: ${{ needs.resolve.outputs.image_ref }}
          RELEASE_IMAGE: ghcr.io/ljguardiola/purosur-cloud:${{ needs.resolve.outputs.tag }}
        run: docker buildx imagetools create --tag "$RELEASE_IMAGE" "$SOURCE_IMAGE"
