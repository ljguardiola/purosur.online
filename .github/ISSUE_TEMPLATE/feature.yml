name: Feature
description: A deliverable vertical slice of user-visible functionality.
labels:
  - "type: feature"
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome does this feature deliver, and for whom?
    validations:
      required: true
  - type: textarea
    id: business-rules
    attributes:
      label: Business rules
      description: Constraints and rules the implementation must respect.
    validations:
      required: true
  - type: textarea
    id: domain-concepts
    attributes:
      label: Domain concepts
      description: >-
        The business concept each rule above belongs to, named after one of the top-level folders
        of `packages/domain/src`, including the ones that are still empty. Choose against the whole
        list, not the folder where similar code already sits. When no folder fits, write
        "new concept: <name>".
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria (Given / When / Then)
      description: One or more Given / When / Then scenarios.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Fill this in only when something non-obvious is excluded.
    validations:
      required: false
