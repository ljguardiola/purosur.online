version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # The build-output guard has to scan and compile classes with the same engine the real
      # build uses (see apps/pos/src/build-output.test.ts), so these move together.
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # TypeScript 7 ships no JavaScript API, and dependency-cruiser supports
      # typescript >=2.0.0 <7.0.0: under 7 it cruises zero modules and exits 0,
      # so the architecture gate would pass without checking anything.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # These types must match the Node major the project runs, pinned in
      # .node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
