packages:
  - packages/*
  - apps/*

allowBuilds:
  electron: true
  "@serialport/bindings-cpp": true
  esbuild: false
  electron-winstaller: true
  # Pulled in by testcontainers' optional SSH-tunnel support, which the recovery integration
  # tests never use (they talk to the container's published port directly).
  cpu-features: false
  protobufjs: false
  ssh2: false

overrides:
  # drizzle-kit still loads through the deprecated @esbuild-kit loader, which pins an esbuild
  # affected by GHSA-67mh-4wv8-2f99. Remove once drizzle-kit no longer depends on @esbuild-kit.
  "@esbuild-kit/core-utils>esbuild": ^0.25.0
