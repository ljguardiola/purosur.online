packages:
  - packages/*
  - apps/*

allowBuilds:
  electron: true
  # Ships prebuilt binaries for every platform the register runs on; its install build compiles
  # nothing then and only leaves files recording the build machine's toolchain.
  better-sqlite3: false
  # Ships prebuilt binaries for every platform the register runs on; its install step
  # (node-gyp-build) compiles nothing when one is there.
  "@serialport/bindings-cpp": false
  esbuild: false
  electron-winstaller: true
  # Build scripts of testcontainers' Docker client dependencies, which it runs without.
  cpu-features: false
  protobufjs: false
  ssh2: false

overrides:
  # drizzle-kit still loads through the deprecated @esbuild-kit loader, which pins an esbuild
  # affected by GHSA-67mh-4wv8-2f99. Remove once drizzle-kit no longer depends on @esbuild-kit.
  "@esbuild-kit/core-utils>esbuild": ^0.25.0
  # @stryker-mutator/core depends on typed-rest-client 2.3.x, which pins a qs affected by
  # GHSA-q8mj-m7cp-5q26 and GHSA-6pq8-jhm2-2vcw. Remove once @stryker-mutator/core moves to
  # typed-rest-client 3 or later.
  "typed-rest-client>qs": ^6.16.1
  # GHSA-3g3m-2fjr-6pw4 affects glob 9 to 14.0.1 and GHSA-g3hv-75wg-m249 affects minimatch 7 to
  # 11.0.0, with no patched release in an earlier major. Each entry below lifts a dependent whose
  # release resolved here asks for an earlier major, either because its newest release still does
  # or because the package that brings it in pins an older release; the new majors keep every glob
  # and minimatch API those releases call. Remove an entry once the release resolved for its
  # dependent asks for glob 14.0.2 or minimatch 11.0.1 itself, or no longer depends on it.
  "archiver-utils>glob": ^14.0.2
  "@joshwooding/vite-plugin-react-docgen-typescript>glob": ^14.0.2
  "@sentry/bundler-plugins>glob": ^14.0.2
  "app-builder-lib>minimatch": ^11.0.1
  "@electron/universal>minimatch": ^11.0.1
  "@stryker-mutator/core>minimatch": ^11.0.1
  # node-gyp 12, which @electron/rebuild 4 asks for, accepts undici 6.29.1, patched for
  # GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm, GHSA-9fm3-97px-rjf6, GHSA-xjj6-f33q-929c and
  # GHSA-4qv8-2p9j-2685, but its lockfile entry does not move without a floor. Remove once
  # @electron/rebuild moves to node-gyp 13 or later.
  "node-gyp>undici": ^6.29.1

patchedDependencies:
  # Two Vitest 5 changes make this runner report caught mutants as surviving: Vitest now matches a
  # test-name filter against names joined with " > " (the runner joins them with a space, so every
  # test inside a describe block is skipped), and a test file that fails to import now reports no
  # tests at all (the runner takes that as a passing run). Remove once the runner handles both.
  "@stryker-mutator/vitest-runner@10.0.0": patches/@stryker-mutator__vitest-runner@10.0.0.patch
  # The provider opens each browser runner page waiting, with no time limit, for its load event, and
  # Vitest waits for every page it opened before ending the run: one page whose load never fires
  # keeps a run whose files all finished open forever. The page is usable once its session connects,
  # which Vitest already bounds with its own connect timeout, so the patch waits only for the
  # navigation to commit. Remove once the provider no longer waits for the load event.
  "@vitest/browser-playwright@5.0.5": patches/@vitest__browser-playwright@5.0.5.patch
  # graphile-worker records a finished or failed job's outcome without awaiting or catching it. A
  # connection dropped during that query is an unhandled rejection, which crashes the cloud when
  # Sentry is not initialized; the patch logs it as a fatal error through graphile-worker's logger
  # instead. A worker stopped while a job runs could also end its pool before that record landed,
  # leaving the job locked for four hours; the patch awaits it. Remove once graphile-worker awaits
  # and handles the outcome record itself.
  "graphile-worker@0.18.0": patches/graphile-worker@0.18.0.patch
