services:
  db:
    image: public.ecr.aws/docker/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: purosur
      POSTGRES_PASSWORD: purosur
      POSTGRES_DB: purosur
    ports:
      - "5432:5432"
    # Postgres 18's image keeps its data in a per-major directory under /var/lib/postgresql, so the
    # volume mounts there, not at .../data.
    volumes:
      - purosur-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purosur -d purosur"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  purosur-db:
